# Publishes the optional run UI (the ui/ folder) to GitHub Pages.
# Optional: it does nothing until Pages is switched on (Settings -> Pages -> Source: GitHub Actions).
# The page holds no secrets. It calls the GitHub API from the browser with the visitor's own token.
name: Deploy UI

on:
  push:
    branches: [ts-prod]
    paths: ['ui/**', '.github/workflows/deploy-ui.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: Is Pages switched on?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          build_type=$(gh api "repos/$REPO/pages" --jq .build_type 2>/dev/null || true)
          if [ "$build_type" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping the UI deploy: Pages is not set to GitHub Actions yet (Settings -> Pages -> Source: GitHub Actions). The UI is optional."
          fi

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Upload the page
        uses: actions/upload-pages-artifact@v3
        with:
          path: ui

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
